<p-dialog header={{title}} [(visible)]="visible" [modal]="true" [maximizable]="true" [draggable]="false"
    [resizable]="false" (onHide)="visibleChange.emit(false)" [contentStyle]="{background: '#fbaeae'}"
    styleClass="custom-dialog">
    <div class="dashboard-body" style="margin-top: 15px;">
        <div class="grid">
            <div class="defect-card" *ngFor="let item of items; let i = index" [class.flipped]="item.isFlipped">
                <div class="card-inner">
                    <div class="card-front">
                        <div class="card-header green">
                            {{ item.name }}
                        </div>
                        <div class="card-body">
                            <button type="button" style="width: 30px; height: 30px;"
                                class="btn btn-primary d-flex align-items-center justify-content-center"
                                (click)="increase(item)">
                                <i class="pi pi-plus"></i>
                            </button>
                            <!-- <span>{{ item.count }} </span> -->
                            <!-- <span (dblclick)="enableEdit(item)" *ngIf="!item.isEdit">{{ item.count }} </span>
                             <div *ngIf="item.isEdit" style="display: flex; align-items: center;">
                                 <input type="number" [(ngModel)]="item.count" (blur)="saveCount(item, $event)" (keydown.enter)="saveCount(item, $event)" />
                             </div> -->
                            <div style="display:flex; align-items:center; justify-content:center;">
                                <ng-container *ngIf="!item.isEdit; else editTpl">
                                    <span (dblclick)="item.isEdit = true" style="min-width:40px; text-align:center;">
                                        {{ item.count }}
                                    </span>
                                </ng-container>

                                <ng-template #editTpl>
                                    <input type="number" [(ngModel)]="item.count" (blur)="saveCount(item, $event)"
                                        (keydown.enter)="saveCount(item, $event)" style="width:60px; text-align:center; border: 1px solid #ccc;" />
                                </ng-template>
                            </div>
                            <button type="button" style="width: 30px; height: 30px;"
                                class="btn btn-danger d-flex align-items-center justify-content-center"
                                (click)="decrease(item)">
                                <i class="pi pi-minus"></i>
                            </button>
                        </div>
                    </div>
                    <div class="card-back">
                        <div class="card-header red">
                            {{ item.name }}
                        </div>
                        <div class="card-body">
                            <button type="button" style="width: 30px; height: 30px;"
                                class="btn btn-primary d-flex align-items-center justify-content-center"
                                (click)="increase(item)">
                                <i class="pi pi-plus"></i>
                            </button>
                            <!-- <span>{{ item.count }}</span> -->
                            <!-- <span (dblclick)="enableEdit(item)" *ngIf="!item.isEdit">{{ item.count }} </span>
                              <div *ngIf="item.isEdit" style="display: flex; align-items: center;">
                                <input type="number" [(ngModel)]="item.count" (blur)="saveCount(item, $event)" (keydown.enter)="saveCount(item, $event)" />
                            </div> -->
                            <div style="display:flex; align-items:center; justify-content:center;">
                                <ng-container *ngIf="!item.isEdit; else editTpl">
                                    <span (dblclick)="item.isEdit = true" style="min-width:40px; text-align:center;">
                                        {{ item.count }}
                                    </span>
                                </ng-container>

                                <ng-template #editTpl>
                                    <input type="number" [(ngModel)]="item.count" (blur)="saveCount(item, $event)"
                                        (keydown.enter)="saveCount(item, $event)" style="width:60px; text-align:center; border: 1px solid #ccc;" />
                                </ng-template>
                            </div>
                            <button type="button" style="width: 30px; height: 30px;"
                                class="btn btn-danger d-flex align-items-center justify-content-center"
                                (click)="decrease(item)">
                                <i class="pi pi-minus"></i>
                            </button>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <ng-template pTemplate="footer">
        <div style="width:100%;display:flex;justify-content:flex-end;gap:8px;">
            <button type="button" class="btn btn-primary" (click)="confirmSelection()">
                OK
            </button>
            <button type="button" class="btn btn-danger" (click)="closeDialog()">
                Close
            </button>
        </div>
    </ng-template>
</p-dialog>
