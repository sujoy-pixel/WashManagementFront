<p-dialog [(visible)]="visible" [modal]="true" [maximizable]="true" [draggable]="false" [resizable]="false"
    (onHide)="visibleChange.emit(false)" [contentStyle]="{background: '#fbaeae'}" styleClass="custom-dialog">
    <ng-template pTemplate="header">
        <div class="custom-header">
            <div class="left-title">
                {{ title }}
            </div>


            <div class="center-input">
                <!-- FIX · Changed [(ngModel)] to [ngModel] (one-way) + (ngModelChange)
                    Removed (input) handler that was modifying DOM directly and
                    conflicting with ngModel, causing the backspace bug. -->
                <input type="text" class="form-control flex-grow-1" placeholder=" Total {{ title }}"
                    [ngModel]="totalInputValue ?? ''" (ngModelChange)="onTotalInputChange($event)"
                    (keydown)="onTotalInputKeydown($event)" (focus)="onTotalInputFocus($event)" autofocus />
            </div>
            <div class="right-space"></div>
        </div>
    </ng-template>

    <div class="dashboard-body" style="margin-top: 15px;">
        <div class="grid">
            <div class="defect-card" *ngFor="let item of items; let i = index" [class.flipped]="item.isFlipped">
                <div class="card-inner">
                    <div class="card-front">
                        <div class="card-header green">{{ item.name }}</div>
                        <div class="card-body">
                            <button type="button" style="width: 30px; height: 30px;"
                                class="btn btn-primary d-flex align-items-center justify-content-center"
                                (click)="increase(item)">
                                <i class="pi pi-plus"></i>
                            </button>
                            <div style="display:flex; align-items:center; justify-content:center;">
                                <ng-container *ngIf="!item.isEdit; else editTplFront">
                                    <!-- ════════════════════════════════════════════════════════
                                        NEW · single-click (was dblclick) to enter edit mode
                                        + cursor: pointer + auto-select on input focus
                                    ═════════════════════════════════════════════════════════ -->
                                    <span (click)="enableEdit(item, 'front')" class="count-display"
                                        style="min-width:40px; text-align:center; cursor: pointer; user-select: none;">
                                        {{ item.count }}
                                    </span>
                                </ng-container>
                                <ng-template #editTplFront>
                                    <!-- FIX · Removed (input) handler that was modifying DOM directly.
                                         With [ngModel] one-way binding, ngModelChange handles sanitization. -->
                                    <input type="number" [attr.data-edit-side]="'front'"
                                        [attr.data-defect-id]="item.defectId" [ngModel]="item.count"
                                        (ngModelChange)="item.count = $event || 0" (blur)="saveCount(item, $event)"
                                        (keydown.enter)="saveCount(item, $event)" (focus)="onCountInputFocus($event)"
                                        (keydown)="onCountInputKeydown($event)"
                                        style="width:60px; text-align:center; border: 1px solid #ccc;" />
                                </ng-template>
                            </div>
                            <button type="button" style="width: 30px; height: 30px;"
                                class="btn btn-danger d-flex align-items-center justify-content-center"
                                (click)="decrease(item)">
                                <i class="pi pi-minus"></i>
                            </button>
                        </div>
                    </div>
                    <div class="card-back">
                        <div class="card-header red">{{ item.name }}</div>
                        <div class="card-body">
                            <button type="button" style="width: 30px; height: 30px;"
                                class="btn btn-primary d-flex align-items-center justify-content-center"
                                (click)="increase(item)">
                                <i class="pi pi-plus"></i>
                            </button>
                            <div style="display:flex; align-items:center; justify-content:center;">
                                <ng-container *ngIf="!item.isEdit; else editTplBack">
                                    <!-- ════════════════════════════════════════════════════════
                                        NEW · single-click (was dblclick) to enter edit mode
                                        + cursor: pointer + auto-select on input focus
                                    ═════════════════════════════════════════════════════════ -->
                                    <span (click)="enableEdit(item, 'back')" class="count-display"
                                        style="min-width:40px; text-align:center; cursor: pointer; user-select: none;">
                                        {{ item.count }}
                                    </span>
                                </ng-container>
                                <ng-template #editTplBack>
                                    <!-- FIX · Removed (input) handler that was modifying DOM directly. -->
                                    <input type="number" [attr.data-edit-side]="'back'"
                                        [attr.data-defect-id]="item.defectId" [ngModel]="item.count"
                                        (ngModelChange)="item.count = $event || 0" (blur)="saveCount(item, $event)"
                                        (keydown.enter)="saveCount(item, $event)" (focus)="onCountInputFocus($event)"
                                        (keydown)="onCountInputKeydown($event)"
                                        style="width:60px; text-align:center; border: 1px solid #ccc;" />
                                </ng-template>
                            </div>
                            <button type="button" style="width: 30px; height: 30px;"
                                class="btn btn-danger d-flex align-items-center justify-content-center"
                                (click)="decrease(item)">
                                <i class="pi pi-minus"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <ng-template pTemplate="footer">
        <!-- ════════════════════════════════════════════════════════════
             NEW · Consolidated footer with all summary info + buttons.
             Removed "Previous Total" per request. Now shows:
             Last Added | Current Entry | Card Sum (with validation) | Grand Total | Running Total | OK/Close
        ═════════════════════════════════════════════════════════════ -->
        <div class="footer-consolidated">

            <!-- Left side: summary chips -->
            <div class="footer-summary-group">

                <!-- Last Added (only shows after first OK) -->
                <div class="footer-chip" *ngIf="lastAddedValue > 0">
                    <span class="chip-label">Last Added</span>
                    <span class="chip-value added">+{{ lastAddedValue }}</span>
                </div>

                <!-- Current Entry -->
                <!-- <div class="footer-chip">
                    <span class="chip-label">Current Entry</span>
                    <span class="chip-value current">{{ totalInputValue || 0 }}</span>
                </div> -->
                <div class="footer-chip" style="display: none;">
                    <span class="chip-label">Current Entry</span>
                    <span class="chip-value current">{{ totalInputValue || 0 }}</span>
                </div>
                <!-- Card Sum with validation indicator -->
                <div class="footer-chip card-sum-chip" [class.invalid]="isCardSumBelowTotal"
                    [class.matched]="isCardSumMatched" [class.exceeds]="isCardSumExceedsTotal" style="display: none;">
                    <span class="chip-label">Card Sum</span>
                    <span class="chip-value">{{ cardSum }}</span>
                    <!-- INVALID: card sum below total — must match or more -->
                    <span class="chip-status invalid-status" *ngIf="isCardSumBelowTotal">
                        <i class="pi pi-exclamation-triangle"></i> Must match or more (short by {{ shortBy }})
                    </span>
                    <!-- VALID: exact match -->
                    <span class="chip-status matched" *ngIf="isCardSumMatched">
                        <i class="pi pi-check-circle"></i> Matched
                    </span>
                    <!-- VALID: exceeds total (allowed) -->
                    <span class="chip-status exceeds" *ngIf="isCardSumExceedsTotal">
                        <i class="pi pi-arrow-up"></i> Exceeds by {{ exceedsBy }}
                    </span>
                </div>

                <!-- Grand Total (live = accumulated + current) -->
                <div class="footer-chip grand-chip"style="display: none;">
                    <span class="chip-label">Grand Total</span>
                    <span class="chip-value grand-val">{{ liveGrandTotal }}</span>
                </div>

            </div>

            <!-- Right side: Running Total + Buttons -->
            <div class="footer-actions-group">
                <!-- <div class="footer-running-total">
                    <i class="pi pi-calculator"></i> -->
                <!-- <span class="footer-total-label">Running Total:</span> -->
                <!-- <span class="footer-total-value">{{ accumulatedTotal }}</span> -->
                <!-- </div> -->
                <div class="footer-buttons">
                    <button type="button" class="btn btn-primary" (click)="confirmSelection()">OK</button>
                    <button type="button" class="btn btn-danger" (click)="closeDialog()">Close</button>
                </div>
            </div>

        </div>
        <!-- ════════════════════════════════════════════════════════════ -->
    </ng-template>
</p-dialog>
