<!-- ================= CARD ================= -->
<div class="card custom-card shadow-sm rounded-4 mb-4">
  <div class="card-header">
    <h5 class="card-title mb-0 fw-semibold">Wash Items Delivery</h5>
  </div>

  <div class="card-body px-4 py-5 text-center">

    <!-- loading -->
    <p *ngIf="isOpening" class="text-muted mb-0">
      <i class="fa fa-spinner fa-spin me-2"></i>Preparing GatePass Wash Dispatch...
    </p>

    <!-- link ready: a real click on an <a target="_blank"> is never popup-blocked -->
    <ng-container *ngIf="!isOpening && gatePassUrl">
      <p class="text-muted mb-3" *ngIf="popupBlocked">
        Your browser blocked the new tab. Click the button to open GatePass.
      </p>
      <p class="text-muted mb-3" *ngIf="!popupBlocked">
        GatePass Wash Dispatch opened in a new tab. If it did not, click the button.
      </p>
      <a class="btn btn-primary px-4" [href]="gatePassUrl" target="_blank" rel="noopener">
        <i class="fa fa-external-link me-2"></i>Open GatePass Wash Dispatch
      </a>
    </ng-container>

    <!-- error -->
    <ng-container *ngIf="!isOpening && !gatePassUrl && errorMessage">
      <p class="text-danger mb-3">{{ errorMessage }}</p>
      <button type="button" class="btn btn-outline-primary px-4" (click)="loadAndOpen()">
        <i class="fa fa-refresh me-2"></i>Try again
      </button>
    </ng-container>

  </div>
</div>
