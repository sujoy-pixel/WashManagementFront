<div class="card custom-card shadow-sm rounded-4">
  <div class="card-header">
    <h5 class="card-title">
      <i class="fa fa-chart-line text-primary me-2"></i> Date Wise Hourly QC Report
    </h5>
  </div>

  <div class="card-body px-4 py-4">
    
    <!-- Row 1 -->
    <div class="row align-items-center mb-2">
      <label class="form-label col-md-1">
        Unit <span class="text-danger">*</span>
      </label>
      <div class="form-control col-md-2 common-border">
        <ng-select [(ngModel)]="Model.UnitId" placeholder="Select Unit">
          <ng-option *ngFor="let u of UnitList" [value]="u.value">{{u.label}}</ng-option>
        </ng-select>
      </div>

      <label class="form-label col-md-1">
        Buyer <span class="text-danger">*</span>
      </label>
      <div class="form-control col-md-2 common-border">
        <ng-select [(ngModel)]="Model.BuyerId" placeholder="Select Buyer" (ngModelChange)="onBuyerChange()">
          <ng-option *ngFor="let u of buyerList" [value]="u.value">{{u.label}}</ng-option>
        </ng-select>
      </div>

      <label class="form-label col-md-1">
        Job <span class="text-danger">*</span>
      </label>
      <div class="form-control col-md-2 common-border">
        <ng-select [(ngModel)]="Model.JobId" placeholder="Select Job" (ngModelChange)="onJobChange()">
          <ng-option *ngFor="let u of jobList" [value]="u.value">{{u.label}}</ng-option>
        </ng-select>
      </div>

      <label class="form-label col-md-1">
        Style <span class="text-danger">*</span>
      </label>
      <div class="form-control col-md-2 common-border">
        <ng-select [(ngModel)]="Model.StyleId" placeholder="Select Style" (ngModelChange)="onStyleChange()">
          <ng-option *ngFor="let u of styleList" [value]="u.value">{{u.label}}</ng-option>
        </ng-select>
      </div>
    </div>

    <!-- Row 2 -->
    <div class="row align-items-center mb-2">
      <label class="form-label col-md-1">
        Order
      </label>
      <div class="form-control col-md-2 common-border">
        <ng-select [(ngModel)]="Model.OrderId" placeholder="Select Order">
          <ng-option *ngFor="let u of orderList" [value]="u.value">{{u.label}}</ng-option>
        </ng-select>
      </div>

      <label class="form-label col-md-1">
        Date
      </label>
      <div class="form-control col-md-2 common-border">
        <input class="form-control" bsDatepicker [(ngModel)]="Model.Date" [bsConfig]="{dateInputFormat:'DD-MMM-YYYY'}">
      </div>

      <label class="form-label col-md-1">
        Report
      </label>
      <div class="form-control col-md-2 common-border">
        <ng-select [items]="reportList" bindLabel="label" bindValue="value" [(ngModel)]="Model.ReportId">
        </ng-select>
      </div>

      <label class="form-label col-md-1">
        Batch No
      </label>
      <div class="form-control col-md-2 common-border">
        <ng-select [items]="batchList" bindLabel="label" bindValue="value" [(ngModel)]="Model.BatchNo">
        </ng-select>
      </div>
    </div>

    <!-- Row 3 -->
    <div class="row align-items-center mb-2">
      <label class="form-label col-md-1">
        Shift
      </label>
      <div class="form-control col-md-2 common-border">
        <ng-select [items]="shiftList" bindLabel="label" bindValue="value" [(ngModel)]="Model.ShiftId">
        </ng-select>
      </div>
    </div>

    <!-- Search Button -->
    <div class="row mt-4">
      <div class="col text-end">
        <button class="btn btn-gradient px-4 py-2" (click)="onSearch()">
          <i class="fa fa-search me-2"></i> Search Report
        </button>
      </div>
    </div>

  </div>
</div>
