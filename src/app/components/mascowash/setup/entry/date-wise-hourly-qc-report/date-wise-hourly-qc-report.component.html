      <div class="row align-items-center mb-2">

        <label class="form-label col-md-1">
          Unit <span class="text-danger">*</span>
        </label>
        <div class="form-control col-md-2 common-border">
          <ng-select [(ngModel)]="Model.UnitId" placeholder="Unit">
            <ng-option *ngFor="let u of UnitList" [value]="u.value">
              {{ u.label }}
            </ng-option>
          </ng-select>
        </div>

        <label class="form-label col-md-1">
          Buyer <span class="text-danger">*</span>
        </label>
        <div class="form-control col-md-2 common-border">
          <ng-select [(ngModel)]="Model.BuyerId" placeholder="Buyer" (ngModelChange)="onBuyerChange()">
            <ng-option *ngFor="let u of buyerList" [value]="u.value">
              {{ u.label }}
            </ng-option>
          </ng-select>
        </div>

        <label class="form-label col-md-1">
          Job <span class="text-danger">*</span>
        </label>
        <div class="form-control col-md-2 common-border">
          <ng-select [(ngModel)]="Model.JobId" placeholder="Select Job" (ngModelChange)="onJobChange()">
            <ng-option *ngFor="let u of jobList" [value]="u.value">
              {{ u.label }}
            </ng-option>
          </ng-select>
        </div>

        <label class="form-label col-md-1">
          Style <span class="text-danger">*</span>
        </label>
        <div class="form-control col-md-2 common-border">

          <ng-select [(ngModel)]="Model.StyleId" placeholder="Style" (ngModelChange)="onStyleChange()">
            <ng-option *ngFor="let u of styleList" [value]="u.value">
              {{ u.label }}
            </ng-option>
          </ng-select>
        </div>

      </div>

      <!-- Order in next row (no space left) -->
      <div class="row align-items-center mb-2">
        <label class="form-label col-md-1">
          Order <span class="text-danger">*</span>
        </label>
        <div class="form-control col-md-2 common-border">
          <ng-select [(ngModel)]="Model.OrderId" placeholder="Order">
            <ng-option *ngFor="let u of orderList" [value]="u.value">
              {{ u.label }}
            </ng-option>
          </ng-select>
        </div>
      </div>

     <!-- Date -->
      <div class="row align-items-center mb-2">
        <label class="form-label col-md-1">
          Date <span class="text-danger">*</span>
        </label>
        <div class="form-control col-md-2 common-border">
          <input type="text" class="form-control" bsDatepicker [(ngModel)]="Model.Date" [bsConfig]="{ dateInputFormat: 'DD-MMM-YYYY' }">
        </div>
      </div>



      <!-- Report -->
      <div class="col-md-3">
        <label class="form-label fw-semibold">Report *</label>
        <div class="form-control common-border">
          <ng-select [(ngModel)]="Model.ReportId" [items]="reportList" bindLabel="label" bindValue="value">
          </ng-select>
        </div>
      </div>

      <!-- Batch No -->
      <div class="col-md-3">
        <label class="form-label fw-semibold">Batch No</label>
        <div class="form-control common-border">
          <ng-select [(ngModel)]="Model.BatchNo" [items]="batchList" bindLabel="label" bindValue="value">
          </ng-select>
        </div>
      </div>

      <!-- Shift -->
      <div class="col-md-3">
        <label class="form-label fw-semibold">Shift</label>
        <div class="form-control common-border">
          <ng-select [(ngModel)]="Model.ShiftId" [items]="shiftList" bindLabel="label" bindValue="value">
          </ng-select>
        </div>
      </div>

      <!-- QC Name -->
      <div class="col-md-3">
        <label class="form-label fw-semibold">QC Name</label>
        <input type="text" class="form-control" [(ngModel)]="Model.QcName" readonly>
      </div>



    </div>

    <!-- Search Button -->
     <div class="row mt-4">
      <div class="col text-end">
        <button class="btn btn-gradient px-4 py-2" (click)="onSearch()">
          <i class="fa fa-search me-2"></i> Search
        </button>
      </div>
    </div> 


  </div>
</div>
