<div class="card custom-card shadow-sm rounded-4">
  <div class="card-header">
    <h5 class="card-title">Date Wise Hourly QC Report</h5>
  </div>
  <div class="card-body px-4 py-4">
    <div class="row g-3">
      
      <!-- Unit -->
      <div class="col-md-3">
        <label class="form-label fw-semibold">Unit *</label>
        <div class="form-control common-border">
          <ng-select [(ngModel)]="Model.UnitId"
                     [items]="UnitList"
                     bindLabel="label"
                     bindValue="value"
                     [clearable]="false">
          </ng-select>
        </div>
      </div>

      <!-- Buyer -->
      <div class="col-md-3">
        <label class="form-label fw-semibold">Buyer *</label>
        <div class="form-control common-border">
          <ng-select [(ngModel)]="Model.BuyerId"
                     [items]="buyerList"
                     bindLabel="label"
                     bindValue="value"
                     (ngModelChange)="onBuyerChange()">
          </ng-select>
        </div>
      </div>

      <!-- Style -->
      <div class="col-md-3">
        <label class="form-label fw-semibold">Style *</label>
        <div class="form-control common-border">
          <ng-select [(ngModel)]="Model.StyleId"
                     [items]="styleList"
                     bindLabel="label"
                     bindValue="value"
                     (ngModelChange)="onStyleChange()">
          </ng-select>
        </div>
      </div>

      <!-- Order -->
      <div class="col-md-3">
        <label class="form-label fw-semibold">Order</label>
        <div class="form-control common-border">
          <ng-select [(ngModel)]="Model.OrderId"
                     [items]="orderList"
                     bindLabel="label"
                     bindValue="value"
                     (ngModelChange)="onOrderChange()">
          </ng-select>
        </div>
      </div>

      <!-- Job -->
      <div class="col-md-3">
        <label class="form-label fw-semibold">Job</label>
        <div class="form-control common-border">
          <ng-select [(ngModel)]="Model.JobId"
                     [items]="jobList"
                     bindLabel="label"
                     bindValue="value">
          </ng-select>
        </div>
      </div>
      
      <!-- Report -->
      <div class="col-md-3">
        <label class="form-label fw-semibold">Report *</label>
        <div class="form-control common-border">
          <ng-select [(ngModel)]="Model.ReportId"
                     [items]="reportList"
                     bindLabel="label"
                     bindValue="value">
          </ng-select>
        </div>
      </div>

      <!-- Batch No -->
      <div class="col-md-3">
        <label class="form-label fw-semibold">Batch No</label>
        <div class="form-control common-border">
          <ng-select [(ngModel)]="Model.BatchNo"
                     [items]="batchList"
                     bindLabel="label"
                     bindValue="value">
          </ng-select>
        </div>
      </div>

      <!-- Shift -->
      <div class="col-md-3">
        <label class="form-label fw-semibold">Shift</label>
        <div class="form-control common-border">
          <ng-select [(ngModel)]="Model.ShiftId"
                     [items]="shiftList"
                     bindLabel="label"
                     bindValue="value">
          </ng-select>
        </div>
      </div>

      <!-- QC Name -->
      <div class="col-md-3">
        <label class="form-label fw-semibold">QC Name</label>
        <input type="text" class="form-control" [(ngModel)]="Model.QcName" readonly>
      </div>

      <!-- Date -->
      <div class="col-md-3">
        <label class="form-label fw-semibold">Date *</label>
        <input type="text" class="form-control" bsDatepicker [(ngModel)]="Model.Date" [bsConfig]="{ dateInputFormat: 'DD-MMM-YYYY' }">
      </div>

    </div>
    
    <div class="text-end mt-4">
      <button class="btn btn-primary" (click)="onSearch()">Search</button>
    </div>

  </div>
</div>
