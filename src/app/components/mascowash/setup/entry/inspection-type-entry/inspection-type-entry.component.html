<div class="card custom-card">
  <div class="card-header">
    <h5 class="card-title">Type of Inspection</h5>
  </div>

  <div class="card-body">

    <!-- Type Name -->
    <div class="row my-2">
      <label class="col-md-2 form-label text-dark">Type Name <span class="text-danger">*</span></label>
      <div class="col-md-4">
        <input type="text" class="form-control" [(ngModel)]="Model.TypeName" placeholder="Enter Type Name"
          name="typename" />
      </div>
    </div>
    <div class="row my-2">
      <span class="col-2 form-label text-dark">Active Status</span>
      <div class="col-md-4">
        <label class="switch">
          <input type="checkbox" [(ngModel)]="Model.IsActive" class="success" name="isactive" />
          <span class="slider round"></span>
        </label>
      </div>
    </div>

    <div class="text-right mt-3">
      <button type="button" class="btn btn-primary" (click)="onSubmit()">
        <i class="fa fa-database"></i> {{ saveButtonTitle }}
      </button>
      <button type="button" class="btn btn-danger ml-2" (click)="onClear()">
        <i class="fa fa-refresh"></i> Clear
      </button>
    </div>
    <hr />
  </div>
</div>
<!-- TABLE DESIGN USING YOUR CUSTOM TABLE STYLE -->
<div class="card mt-3">
  <div class="table-responsive">
    <table class="table table-striped table-bordered custom-table">
      <thead class="custom-table-header">
        <tr>
          <th class="custom-table-th">#</th>
          <th style="text-align: center">Type Name</th>
          <th style="text-align: center">Active Status</th>
          <th style="text-align: center">Action</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let item of dataList; let i = index">
          <td>{{ i + 1 }}</td>
          <td>{{ item.typeName }}</td>
          <td class="text-center">
            <span class="status-badge" [ngClass]="item.isActive == 1 ? 'status-active' : 'status-inactive'">
              <i class="status-dot" [ngClass]="item.isActive == 1 ? 'dot-active' : 'dot-inactive'"></i>
              {{ item.isActive == 1 ? "Active" : "Inactive" }}
            </span>
          </td>

          <td style="text-align:center">

            <button class="btn btn-sm btn-success me-1" (click)="edit(item)">
              Edit
            </button>
            <button class="btn btn-sm btn-danger" (click)="delete(item)">
              Delete
            </button>
          </td>
        </tr>

        <tr *ngIf="dataList.length === 0">
          <td colspan="4" class="text-center">No records found</td>
        </tr>

      </tbody>
    </table>
    <app-custom-pagination [totalRecords]="totalRecords" [rows]="rows" [rowsPerPageOptions]="[10, 20, 30]"
      (pageChange)="onPageChange($event)">
    </app-custom-pagination>
  </div>
</div>
