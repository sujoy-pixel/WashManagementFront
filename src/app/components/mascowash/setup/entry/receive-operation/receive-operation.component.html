 <div class="card-header border-bottom justify-content-between">
        <div class="card-title">Wash Order Receive Operationt</div>
      </div>
  <div>
    <button class="btn btn-primary me-2" (click)="onNew()">
      <i class="fa fa-plus"></i> New
    </button>

    <button class="btn btn-info" (click)="onReview()">
      <i class="fa fa-search"></i> Review / Check
    </button>
  </div>
</div>
<div class="card custom-card mb-3" *ngIf="isReviewMode">
  <div class="card-body">

    <div class="row my-2">
      <div class="col-md-4">
        <div class="row align-items-center">
          <label class="form-label col-md-4">Unit <span style="color:red">*</span></label>
          <div class="form-control col-md-8 common-border">
            <ng-select [(ngModel)]="review.unitId" placeholder="Select Unit">
              <ng-option *ngFor="let u of unitList" [value]="u.value">
                {{ u.label }}
              </ng-option>
            </ng-select>
          </div>
        </div>
      </div>

      <div class="col-md-4">
        <div class="row align-items-center">
          <label class="form-label col-md-4">From Date</label>
          <div class="form-control col-md-8 common-border">
            <input type="text" bsDatepicker [(ngModel)]="review.fromDate" />
          </div>
        </div>
      </div>

      <div class="col-md-4">
        <div class="row align-items-center">
          <label class="form-label col-md-4">To Date</label>
          <div class="form-control col-md-8 common-border">
            <input type="text" bsDatepicker [(ngModel)]="review.toDate" />
          </div>
        </div>
      </div>

    </div>

  </div>
</div>

<!-- UNIT (HIDDEN IN REVIEW MODE) -->
<div class="row my-2" *ngIf="!isReviewMode">
  <div class="col-md-4">
    <div class="row align-items-center">
      <label class="form-label col-md-4">
        Unit <span style="color:red">*</span>
      </label>

      <div class="form-control col-md-8 common-border">
        <ng-select
          [(ngModel)]="Model.unitId"
          placeholder="Select Unit">
          <ng-option
            *ngFor="let u of unitList"
            [value]="u.value">
            {{ u.label }}
          </ng-option>
        </ng-select>
      </div>
    </div>
  </div>
</div>

<!-- OPERATION MODE INPUTS -->
<div class="card custom-card mb-3">
  <div class="card-body">

    <div class="row g-3 align-items-center">

      <!-- TRACKING NO -->
      <div class="col-md-4">
        <div class="d-flex align-items-center justify-content-between mb-1">
          <label class="form-label mb-0">Tracking No</label>

          <label class="switch">
            <input type="checkbox"
                   [(ngModel)]="Model.isTrackingActive" class="success" />
            <span class="slider round"></span>
          </label>
        </div>

        <input type="text"
               class="form-control"
               placeholder="Scan / Enter Tracking No"
               [(ngModel)]="Model.trackingNo"
               [disabled]="!Model.isTrackingActive"
               
                />
      </div>

      <!-- DYEING BATCH -->
      <div class="col-md-4">
        <div class="d-flex align-items-center justify-content-between mb-1">
          <label class="form-label mb-0">Dyeing Batch</label>

          <label class="switch">
            <input type="checkbox"
                   [(ngModel)]="Model.isDyeingActive" class="success"/>
            <span class="slider round"></span>
          </label>
        </div>

        <input type="text"
               class="form-control"
               placeholder="Scan /Enter Dyeing Batch No"
               [(ngModel)]="Model.dyeingBatchNo"
               [disabled]="!Model.isDyeingActive" />
      </div>

      <!-- MANUAL -->
      <div class="col-md-4">
        <div class="d-flex align-items-center justify-content-between mb-1">
          <label class="form-label mb-0">Manual</label>

          <label class="switch">
            <input type="checkbox"
                   [(ngModel)]="Model.isManualActive" class="success"  />
            <span class="slider round"></span>
          </label>
        </div>

        <input type="text"
       class="form-control"
       placeholder="Scan / Enter Manual Reference"
       [(ngModel)]="Model.manualNo"
       disabled>


    </div>

  </div>
</div>

<div class="table-responsive">
  <table class="table table-bordered table-sm align-middle custom-table">
    <thead class="table-light text-center">
      <tr>
        <th>Tracking / Batch</th>
        <th>From Unit</th>
        <th>Receive Date</th>
        <th>Buyer</th>
        <th>Job</th>
        <th>Style</th>
        <th>Type</th>
        <th>Fabrication</th>
        <th>Composition</th>
        <th>GSM</th>
        <th>Color</th>
        <th>Dress Part</th>
        <th>Operation Types</th>
        <th>UOM</th>
        <th>Total Qty</th>
        <th>Size</th>
        <th>Probable Delivery</th>
        <th>Shipment Date</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let row of detailList">

        <td>{{ row.trackingNo }}</td>

        <td>
          <ng-select [(ngModel)]="row.fromUnitId"></ng-select>
        </td>

        <td>
          <input type="text" bsDatepicker [(ngModel)]="row.receiveDate" />
        </td>

        <td><input class="form-control form-control-sm" [(ngModel)]="row.buyer"></td>
        <td><input class="form-control form-control-sm" [(ngModel)]="row.job"></td>
        <td><input class="form-control form-control-sm" [(ngModel)]="row.style"></td>

        <td>
          <ng-select [(ngModel)]="row.typeName">
            <ng-option value="Fabric">Fabric</ng-option>
            <ng-option value="GMT">GMT</ng-option>
            <ng-option value="Cutting">Cutting Parts</ng-option>
          </ng-select>
        </td>

        <td><ng-select [(ngModel)]="row.fabricationId"></ng-select></td>
        <td><input class="form-control form-control-sm" [(ngModel)]="row.composition"></td>
        <td><ng-select [(ngModel)]="row.gsmId"></ng-select></td>
        <td><ng-select [(ngModel)]="row.colorId"></ng-select></td>
        <td><ng-select [(ngModel)]="row.dressPartId"></ng-select></td>

        <td>
          <input class="form-control form-control-sm"
                 placeholder="Wash, Dry, Finish"
                 [(ngModel)]="row.operationTypes">
        </td>

        <td><ng-select [(ngModel)]="row.uomId"></ng-select></td>

        <td class="text-end fw-bold">{{ row.totalQty }}</td>

        <td class="text-center">
          <button class="btn btn-sm btn-outline-primary"
                  (click)="openSizePopup(row)">
            Size
          </button>
        </td>

        <td>
          <input type="text" bsDatepicker [(ngModel)]="row.probableDeliveryDate">
        </td>

        <td>
          <input type="text" bsDatepicker [disabled]="true"
                 [(ngModel)]="row.shipmentDate">
        </td>

      </tr>
    </tbody>
  </table>
</div>
<div class="text-right mt-3">
  <button class="btn btn-primary" (click)="onSave()">
    <i class="fa fa-save"></i> Save
  </button>

  <button class="btn btn-warning ms-2" (click)="onReturn()">
    Return
  </button>

  <button class="btn btn-danger ms-2" (click)="onClose()">
    Close
  </button>
</div>
