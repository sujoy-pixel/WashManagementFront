<div class="tile-menu-page">
  <div class="tile-menu-wrap">

    <!-- Contextual header: only shown once the user has drilled into a section -->
    <div class="tile-menu-header" *ngIf="!isAtRoot">
      <button type="button" class="tile-nav-btn" (click)="goHome()" title="Back to start">
        <i class="fe fe-home"></i>
      </button>
      <button type="button" class="tile-nav-btn" (click)="goBack()" title="Go back">
        <i class="fe fe-arrow-left"></i>
      </button>

      <nav class="tile-breadcrumb" aria-label="breadcrumb">
        <span *ngFor="let crumb of breadcrumbTrail; let i = index; let last = last">
          <a href="javascript:void(0)" (click)="goToCrumb(i)" [class.active]="last">{{ crumb.title }}</a>
          <i class="fe fe-chevron-right crumb-sep" *ngIf="!last"></i>
        </span>
      </nav>
    </div>

    <!-- Loading state -->
    <div class="tile-state-panel" *ngIf="loadingMenu">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
      <p class="mt-3 text-muted">Loading your menu...</p>
    </div>

    <!-- Error state -->
    <div class="tile-state-panel" *ngIf="!loadingMenu && menuLoadError">
      <i class="fe fe-alert-triangle tile-state-icon text-warning"></i>
      <p class="mt-3 text-muted">Unable to load the menu right now. Please try again later.</p>
    </div>

    <!-- Empty state -->
    <div class="tile-state-panel" *ngIf="!loadingMenu && !menuLoadError && currentTiles.length === 0">
      <i class="fe fe-inbox tile-state-icon text-muted"></i>
      <p class="mt-3 text-muted">No menu items found.</p>
    </div>

    <!-- Tile grid -->
    <div class="tile-grid" *ngIf="!loadingMenu && !menuLoadError && currentTiles.length > 0">
      <div class="tile-card" *ngFor="let tile of currentTiles; let i = index"
           [style.background]="tile.gradient"
           [style.animation-delay.ms]="i * 45"
           (click)="openTile(tile)" tabindex="0"
           (keyup.enter)="openTile(tile)" role="button">
        <span class="tile-top-accent"></span>
        <div class="tile-content">
          <div class="tile-icon-wrap" [style.color]="tile.accent">
            <i class="fe fe-{{ tile.icon }}"></i>
          </div>
          <div class="tile-title">{{ tile.title }}</div>
        </div>
        <div class="tile-chevron" *ngIf="tile.children?.length" [style.color]="tile.accent">
          <i class="fe fe-chevron-right"></i>
        </div>
      </div>
    </div>

  </div>
</div>
