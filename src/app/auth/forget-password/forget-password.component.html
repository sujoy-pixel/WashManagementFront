<div class="page d-flex justify-content-center align-items-center min-vh-100 position-relative"
  style="background: url('./assets/images/wash.png') no-repeat center center / cover;">

  <div class="position-absolute top-0 start-0 w-100 h-100" style="background-color: rgba(0, 0, 0, 0.4); z-index: 1;">
  </div>

  <div class="login-wrapper bg-white shadow-lg p-4"
    style="width: 100%; max-width: 420px; backdrop-filter: blur(5px); background-color: rgba(255, 255, 255, 0.9); z-index: 2; border-radius: 2rem;">
    <div class="text-center mb-4">
      <img src="./assets/images/MascoLogo.png" alt="Logo" style="height: 60px;" />
      <h4 class="mt-3 fw-bold text-primary">MASCO WASH</h4>
      <p class="text-muted">Enter the email address registered on your account</p>
    </div>

    <form>
      <!-- Username -->
      <div class="form-group mb-3">
        <label class="form-label">Email</label>
        <div class="input-group">
          <span class="input-group-text bg-light"><i class="zmdi zmdi-email text-primary"></i></span>
          <input class="form-control" id="eMail" #passwordResetEmail  placeholder="Enter Your Email" type="email">
        </div>
      </div>
        <div class="text-end mb-3">
     
       <a routerLink="/auth/login" class="text-decoration-none small text-primary">Send me Back</a>
      </div>

      <div class="d-grid mb-3">
        <button 
          type="submit" 
          (click)="authService.ForgotPassword(passwordResetEmail.value)" 
          routerLink="/auth/verify-email-address"
          class="btn px-4 py-2 rounded-3 shadow-sm text-white"
          [ngStyle]="{'background-color': '#00897b'}" 
        >
          Submit
        </button>
      </div>
    </form>
  </div>
</div>
